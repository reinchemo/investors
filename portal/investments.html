<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Investments | STARLINK ULTRANET LLC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
         :root {
            --bg: #080f1e;
            --panel: #111d32;
            --panel2: #172640;
            --line: rgba(148, 163, 184, .14);
            --text: #edf4ff;
            --muted: #91a4bf;
            --cyan: #38d5f2;
            --blue: #638cff;
            --green: #35d49a;
            --red: #ff7185;
            --yellow: #f7c66b;
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(ellipse at 10% 0%, rgba(56, 213, 242, .12), transparent 35%), radial-gradient(ellipse at 90% 10%, rgba(99, 140, 255, .12), transparent 30%), var(--bg);
        }
        
        .topbar {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid var(--line);
            background: rgba(8, 15, 30, .88);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }
        
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #06101e;
            font-weight: 900;
            font-size: 18px;
        }
        
        .brand-name {
            font-family: Outfit, sans-serif;
            font-weight: 800
        }
        
        .brand-sub {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1.5px
        }
        
        .top-actions {
            display: flex;
            gap: 10px
        }
        
        .btn {
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 10px 15px;
            color: var(--text);
            background: var(--panel2);
            cursor: pointer;
            transition: .2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--cyan)
        }
        
        main {
            max-width: 1150px;
            margin: auto;
            padding: 42px 24px 70px
        }
        
        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-size: 13px
        }
        
        .heading {
            margin: 25px 0 28px
        }
        
        .eyebrow {
            color: var(--cyan);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px
        }
        
        h1 {
            font-family: Outfit, sans-serif;
            font-size: clamp(30px, 5vw, 43px);
            margin: 9px 0
        }
        
        .subtitle {
            color: var(--muted);
            margin: 0;
            line-height: 1.6
        }
        
        .investor-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 25px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(120deg, rgba(23, 38, 64, .98), rgba(17, 29, 50, .85));
            margin: 28px 0;
            animation: rise .45s ease both;
        }
        
        .investor-name {
            font-family: Outfit, sans-serif;
            font-size: 23px;
            font-weight: 800
        }
        
        .investor-number {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px
        }
        
        .investor-badge {
            padding: 8px 13px;
            border-radius: 30px;
            background: rgba(53, 212, 154, .12);
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 24px 0
        }
        
        .stat {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(23, 38, 64, .95), rgba(17, 29, 50, .85));
            animation: rise .5s ease both;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--muted)
        }
        
        .stat-value {
            font-family: Outfit, sans-serif;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 800;
            margin-top: 10px;
            overflow-wrap: anywhere
        }
        
        .cyan {
            color: var(--cyan)
        }
        
        .green {
            color: var(--green)
        }
        
        .yellow {
            color: var(--yellow)
        }
        
        .section-head {
            margin: 35px 0 16px
        }
        
        .section-head h2 {
            font-family: Outfit, sans-serif;
            font-size: 21px;
            margin: 0
        }
        
        .section-head p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px
        }
        
        .panel {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(17, 29, 50, .9);
            padding: 22px;
        }
        
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 15px
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px
        }
        
        th,
        td {
            text-align: left;
            padding: 16px 17px;
            border-bottom: 1px solid var(--line);
            font-size: 12px
        }
        
        th {
            background: rgba(23, 38, 64, .75);
            color: var(--muted);
            font-weight: 700
        }
        
        td {
            color: #dce8f7
        }
        
        tr:last-child td {
            border-bottom: 0
        }
        
        .amount {
            font-weight: 800;
            color: var(--green)
        }
        
        .action-tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 30px;
            background: rgba(56, 213, 242, .12);
            color: var(--cyan);
            font-size: 10px;
            font-weight: 800;
        }
        
        .empty,
        .message {
            padding: 35px 22px;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 18px;
            color: var(--muted);
            background: rgba(17, 29, 50, .6);
        }
        
        .error {
            color: #ff9baa;
            border-color: rgba(255, 113, 133, .3)
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 45px;
            color: var(--muted)
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #33445e;
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        
        .notice {
            margin-top: 20px;
            padding: 15px 18px;
            border: 1px solid var(--line);
            border-radius: 13px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            background: rgba(56, 213, 242, .05);
        }
        
        footer {
            text-align: center;
            color: #71839e;
            font-size: 11px;
            padding: 25px;
            border-top: 1px solid var(--line)
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
        
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        
        @media(max-width:700px) {
            .topbar {
                padding: 0 15px;
                height: 68px
            }
            .brand-sub {
                display: none
            }
            .top-actions .btn {
                padding: 9px;
                font-size: 11px
            }
            main {
                padding: 28px 15px 50px
            }
            .summary {
                grid-template-columns: 1fr;
                gap: 10px
            }
            .stat {
                padding: 17px
            }
            .investor-hero {
                align-items: flex-start;
                flex-direction: column;
                padding: 19px
            }
            .investor-name {
                font-size: 20px
            }
            .panel {
                padding: 15px
            }
        }
        .funding-section{margin-top:38px;padding-top:30px;border-top:1px solid var(--line)}
        .funding-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
        .funding-heading h2{font:800 26px Outfit,sans-serif;margin:8px 0}
        .funding-heading p,.funding-hint{color:var(--muted);font-size:12px;line-height:1.6}
        .funding-private,.funding-state{font-size:10px;font-weight:800;letter-spacing:.7px;padding:8px 11px;border-radius:30px;background:rgba(53,212,154,.1);color:var(--green);border:1px solid rgba(53,212,154,.22)}
        .funding-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0}
        .funding-stat{padding:18px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(23,38,64,.96),rgba(17,29,50,.85))}
        .funding-stat small,.funding-metrics small{display:block;color:var(--muted);font-size:11px}
        .funding-stat strong{display:block;font:800 22px Outfit,sans-serif;margin-top:9px;color:var(--cyan);overflow-wrap:anywhere}
        .funding-stat strong.green{color:var(--green)}
        .funding-kyc{padding:13px 16px;border:1px solid rgba(56,213,242,.2);border-radius:12px;background:rgba(56,213,242,.06);font-size:12px;color:#ccecf6}
        .funding-contract,.funding-offer{padding:20px;border:1px solid var(--line);border-radius:17px;background:rgba(17,29,50,.9);margin:14px 0}
        .funding-contract-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
        .funding-contract h3,.funding-offer h3{font:700 18px Outfit,sans-serif;margin:7px 0}
        .funding-contract p,.funding-offer p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
        .funding-ref{font:700 10px 'JetBrains Mono',monospace;color:var(--cyan);letter-spacing:1px}
        .funding-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
        .funding-metrics>div{padding:12px;border-radius:11px;background:rgba(255,255,255,.025)}
        .funding-metrics strong{display:block;font-size:14px;margin-top:6px;overflow-wrap:anywhere}
        .funding-calculation{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px;border-radius:11px;background:rgba(56,213,242,.055);border:1px solid rgba(56,213,242,.14);font-size:12px;color:var(--muted);margin:12px 0}
        .funding-calculation strong{color:var(--green)}
        .funding-label{display:block;font-size:11px;color:var(--muted);margin:16px 0 7px}
        .funding-amount{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font:600 14px inherit}
        .funding-consent{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:11px;line-height:1.55;margin:14px 0}.funding-consent input{margin-top:2px;accent-color:var(--cyan)}
        .funding-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#06101e;font-weight:800;border:0;margin-top:10px}
        .funding-primary:disabled{opacity:.45;cursor:not-allowed}
        @media(max-width:700px){.funding-summary{grid-template-columns:1fr}.funding-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.funding-heading h2{font-size:22px}}
    </style>

<body>

    <header class="topbar">

            <div class="brand-mark">S</div>

                <div class="brand-name">STARLINK ULTRANET</div>

        </div>
    </header>

    <main>
        <a class="back-link" href="dashboard.html">← Back to my dashboard</a>

        <section class="heading">
            <div class="eyebrow">INVESTOR RELATIONS</div>
            <h1>My Investments</h1>
            <p class="subtitle">A personal overview of your recorded capital contributions and equity.</p>
        </section>

        <div id="content">
            <div class="loading"><span class="spinner"></span> Loading your investment records...</div>
        </div>
    </main>

    <footer>STARLINK ULTRANET LLC · Secure Personal Investor Portal</footer>

    <script>
        const SUPABASE_URL = "https://ujhasodlnduoozlmxdbv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DK0i6IuTFcE6_g1P6gG_-A_IkwguvIL";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL, SUPABASE_ANON_KEY
        );

        const content = document.getElementById("content");

        function safe(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        function money(value) {
            return new Intl.NumberFormat("en-KE", {
                style: "currency",
                currency: "KES",
                maximumFractionDigits: 2
            }).format(Number(value || 0));
        }

        function dateText(value) {
            if (!value) return "Not recorded";
            const date = new Date(value + "T00:00:00");
            if (Number.isNaN(date.getTime())) return safe(value);
            return date.toLocaleDateString("en-KE", {
                day: "numeric",
                month: "short",
                year: "numeric"
            });
        }

        function display(value) {
            return value === null || value === undefined || value === "" ? "—" : safe(value);
        }

        async function loadInvestments() {
            content.innerHTML = '<div class="loading"><span class="spinner"></span> Loading your investment records...</div>';

            try {
                const {
                    data: sessionData,
                    error: sessionError
                } = await supabaseClient.auth.getSession();

                if (sessionError) throw sessionError;
                if (!sessionData.session) {
                    window.location.href = "../login.html";
                    return;
                }

                // Investor identity is resolved server-side from the verified
                // session. The browser never supplies an investor_id.
                const {
                    data: result,
                    error: portalError
                } = await supabaseClient.functions.invoke("portal-personal-data", {
                    body: { action: "investments" }
                });

                if (portalError) throw portalError;
                if (!result || result.success !== true) {
                    throw new Error(result?.error || "Unable to load your investment information.");
                }

                let fundingData = { opportunities: [], commitments: [], funder: null };
                try {
                    const { data: fundingResult, error: fundingError } = await supabaseClient.functions.invoke("portal-personal-data", { body: { action: "funding" } });
                    if (fundingError) throw fundingError;
                    if (fundingResult?.success) fundingData = fundingResult;
                } catch (fundingError) { console.warn("Short-term funding portfolio unavailable:", fundingError); }

                // A standalone short-term funder does not need an equity investor record.
                if (!result.investor) {
                    if (fundingData.funder) {
                        renderFunderOnly(fundingData);
                    } else {
                        content.innerHTML = `
                            <div class="message">
                                <div style="font-size:34px;margin-bottom:12px">📊</div>
                                <strong>Investor access is not available</strong>
                                <p>This account is not linked to an investor or short-term funder profile.</p>
                            </div>`;
                    }
                    return;
                }

                renderInvestor(result.investor, result.investments || [], result.transactions || [], fundingData);

            } catch (error) {
                console.error("Investment page error:", error);
                content.innerHTML = `
                    <div class="message error">
                        <strong>Unable to load your investment information</strong>
                        <p>${safe(error.message || "Please sign in again and retry.")}</p>
                        <button class="btn" onclick="loadInvestments()">Try again</button>
                    </div>`;
            }
        }

        function renderFundingSection(data) {
            const commitments = Array.isArray(data.commitments) ? data.commitments : [];
            const opportunities = Array.isArray(data.opportunities) ? data.opportunities : [];
            const cash = (value,currency="KES") => new Intl.NumberFormat("en-KE",{style:"currency",currency,maximumFractionDigits:2}).format(Number(value||0));
            const verified = commitments.filter(c => Number(c.capital_received || 0) > 0);
            const totalsByCurrency = {};
            verified.forEach(c => {
                const currency=c.currency_code||"KES";
                const ratio=Number(c.principal_amount)>0?Math.min(1,Number(c.capital_received||0)/Number(c.principal_amount)):0;
                totalsByCurrency[currency]=totalsByCurrency[currency]||{principal:0,net:0};
                totalsByCurrency[currency].principal+=Number(c.capital_received||0);
                totalsByCurrency[currency].net+=Number(c.net_return||0)*ratio;
            });
            const totalInvestedHtml=Object.entries(totalsByCurrency).map(([currency,values])=>'<span>'+cash(values.principal,currency)+'</span>').join(' · ')||cash(0,"KES");
            const projectedNetHtml=Object.entries(totalsByCurrency).map(([currency,values])=>'<span>'+cash(values.net,currency)+'</span>').join(' · ')||cash(0,"KES");
            const activeCount = verified.filter(c => ["active_funding","funded","matured","partially_settled","overdue"].includes(c.status)).length;
            const statusLabel = value => String(value||"").replaceAll("_"," ").replace(/\b\w/g,x=>x.toUpperCase());
            const commitmentRows = commitments.length ? commitments.map(c => {
                const terms = c.terms_snapshot || {};
                const received = Number(c.capital_received || 0);
                const ratio = Number(c.principal_amount) > 0 ? Math.min(1, received / Number(c.principal_amount)) : 0;
                const gross = Number(c.gross_return || 0) * ratio;
                const deductions = Number(c.estimated_deductions || 0) * ratio;
                const net = Number(c.net_return || 0) * ratio;
                const election = c.renewal_election || null;
                const canElect = ["matured","overdue","partially_settled"].includes(c.status);
                const opportunityOptions = opportunities.map(o=>'<option value="'+Number(o.id)+'">'+safe(o.reference_code)+' · '+safe(o.title)+'</option>').join("");
                const maturityAction = canElect ? (election
                  ? '<div class="funding-kyc"><strong>Maturity instruction:</strong> '+safe(statusLabel(election.status))+' · '+safe(election.election_type.replaceAll("_"," "))+(election.new_commitment_id?' · New contract #'+Number(election.new_commitment_id):'')+(election.decision_reason?' · '+safe(election.decision_reason):'')+'</div>'
                  : '<div class="funding-kyc"><strong>Maturity instruction</strong><p class="funding-hint">Available principal '+cash(Math.max(0,Number(c.capital_received||0)-Number(c.principal_repaid||0)),c.currency_code)+' · Estimated outstanding return '+cash(Math.max(0,Number(c.net_return||0)-Number(c.return_paid||0)),c.currency_code)+'</p><div class="funding-metrics"><div><small>Choose what happens next</small><select id="maturity-type-'+Number(c.id)+'"><option value="withdraw">Withdraw principal and return</option><option value="reinvest_principal">Reinvest principal only</option><option value="reinvest_principal_and_return">Reinvest principal plus return</option><option value="reinvest_partial">Reinvest part of the amount</option></select></div><div><small>New opportunity (for reinvestment)</small><select id="maturity-opportunity-'+Number(c.id)+'"><option value="">Select opportunity</option>'+opportunityOptions+'</select></div><div><small>Partial amount (only for partial reinvestment)</small><input id="maturity-amount-'+Number(c.id)+'" type="number" min="1" step="0.01" placeholder="Amount to reinvest"></div></div><button class="btn funding-primary" onclick="submitFundingMaturityInstruction('+Number(c.id)+')">Submit maturity instruction</button><p class="funding-hint">No automatic renewal. A new agreement is required and the reinvestment is not processed until the agreement is verified.</p></div>')
                  : "");
                return '<article class="funding-contract"><div class="funding-contract-head"><div><span class="funding-ref">'+safe(terms.reference_code || ("FUND-"+c.id))+'</span><h3>'+safe(terms.title || "Short-term funding")+'</h3><p>'+safe(terms.funding_purpose || "Business funding")+'</p></div><span class="funding-state">'+safe(statusLabel(c.status))+'</span></div>'+
                  '<div class="funding-metrics"><div><small>Agreed principal</small><strong>'+cash(c.principal_amount,c.currency_code)+'</strong></div><div><small>Verified funds received</small><strong>'+cash(received,c.currency_code)+'</strong></div><div><small>Return rate</small><strong>'+safe(c.display_rate)+'% '+(c.return_type==="annualised_simple"?"p.a.":"total")+'</strong></div><div><small>Tenure</small><strong>'+safe(c.term_days)+' days</strong></div><div><small>Estimated net return</small><strong class="green">'+cash(net,c.currency_code)+'</strong></div><div><small>Maturity date</small><strong>'+dateText(c.maturity_date)+'</strong></div></div>'+
                  '<div class="funding-calculation"><span>Gross return '+cash(gross,c.currency_code)+'</span><span>Estimated deductions '+cash(deductions,c.currency_code)+'</span><strong>Projected total at maturity '+cash(Number(c.active_capital||0)+net,c.currency_code)+'</strong></div>'+
                  maturityAction+
                  (c.status==="interested" ? '<button class="btn funding-primary" onclick="submitFundingCommitment('+Number(c.id)+')" '+(data.funder?.kyc_status!=="verified"?"disabled":"")+'>Submit commitment</button>' : '')+
                  (c.status==="interested"&&data.funder?.kyc_status!=="verified" ? '<p class="funding-hint">Complete and verify KYC before submitting a formal commitment.</p>' : '')+
                  '<p class="funding-hint">Only verified receipts count as invested capital. Return figures use the locked terms snapshot and remain estimates until settlement.</p></article>';
            }).join("") : '<div class="empty"><strong>No short-term funding records yet</strong><p>Your funding interests, commitments and verified investments will appear here.</p></div>';
            const offerCards = opportunities.length ? opportunities.map(o => {
                const rate=Number(o.proposed_return_rate||0),term=Number(o.term_days||120);
                const denominator=o.day_count_basis==="actual_360"||o.day_count_basis==="30_360"?360:365;
                const initialGross=o.return_type==="annualised_simple"?Number(o.minimum_commitment)*rate/100*term/denominator:Number(o.minimum_commitment)*rate/100;
                const initialTax=initialGross*Number(o.tax_rate||0)/100;
                const initialExtras=Array.isArray(o.other_deductions)?o.other_deductions.reduce((sum,item)=>sum+(item.type==="fixed"?Number(item.amount||0):initialGross*Number(item.rate??item.percentage??0)/100),0):0;
                const initialNet=Math.max(0,initialGross-initialTax-initialExtras);
                return '<article class="funding-offer"><div class="funding-contract-head"><div><span class="funding-ref">'+safe(o.reference_code)+'</span><h3>'+safe(o.title)+'</h3><p>'+safe(o.funding_purpose||o.description||"")+'</p></div><span class="funding-state">APPROVED OFFER</span></div>'+(o.payment_instructions?'<div class="funding-calculation"><span>Payment instructions</span><strong>'+safe(o.payment_instructions)+'</strong></div>':'')+
                  '<div class="funding-metrics"><div><small>Return rate</small><strong>'+rate+'% '+(o.return_type==="annualised_simple"?"p.a.":"for term")+'</strong></div><div><small>Tenure</small><strong>'+term+' days</strong></div><div><small>Minimum</small><strong>'+cash(o.minimum_commitment,o.currency_code)+'</strong></div><div><small>Maximum</small><strong>'+(o.maximum_commitment?cash(o.maximum_commitment,o.currency_code):"Opportunity capacity")+'</strong></div></div>'+(Array.isArray(o.required_documents)&&o.required_documents.length?'<p class="funding-hint">Required documents: '+o.required_documents.map(safe).join(", ")+'</p>':'')+'<p class="funding-hint">Eligibility: '+safe(JSON.stringify(o.eligibility||{}))+'</p>'+
                  '<label class="funding-label" for="funding-amount-'+o.id+'">Calculate your return ('+safe(o.currency_code)+')</label><input class="funding-amount" id="funding-amount-'+o.id+'" data-currency="'+safe(o.currency_code||"KES")+'" data-tax="'+Number(o.tax_rate||0)+'" data-deductions="'+safe(JSON.stringify(o.other_deductions||[]))+'" type="number" min="'+o.minimum_commitment+'" '+(o.maximum_commitment?'max="'+o.maximum_commitment+'"':'')+' step="100" value="'+o.minimum_commitment+'" oninput="calculateFundingOffer('+o.id+','+rate+','+term+',\''+o.return_type+'\',\''+o.day_count_basis+'\')">'+
                  '<div class="funding-calculation" id="funding-calc-'+o.id+'"><span>Gross '+cash(initialGross,o.currency_code)+' · Deductions '+cash(initialTax+initialExtras,o.currency_code)+'</span><strong>Net return '+cash(initialNet,o.currency_code)+' · Maturity '+cash(Number(o.minimum_commitment)+initialNet,o.currency_code)+'</strong></div>'+
                  '<label class="funding-consent"><input type="checkbox" id="funding-consent-'+o.id+'"> I consent to STARLINK using my submitted contact and KYC information to assess this funding request under the published terms and retention policy.</label><button class="btn funding-primary" onclick="expressFundingInterest('+o.id+')">Express interest</button><p class="funding-hint">Interest is not a commitment or payment. KYC, a signed agreement and verified payment are required before funding becomes active.</p></article>';
            }).join("") : '<div class="empty"><strong>No approved funding opportunities are currently open</strong><p>Offers appear only after management, legal and finance approval. No unapproved rate or tax setting can be used in a live offer.</p></div>';
            return '<section class="funding-section" id="short-term-funding"><div class="funding-heading"><div><div class="eyebrow">PRODUCT B · SHORT-TERM BUSINESS FUNDING</div><h2>My Short-Term Funding</h2><p>Separate from your ordinary shareholding and equity contributions.</p></div><span class="funding-private">🔒 PRIVATE INVESTOR VIEW</span></div>'+
              '<div class="funding-summary"><div class="funding-stat"><small>Total verified capital received</small><strong>'+totalInvestedHtml+'</strong></div><div class="funding-stat"><small>Estimated net return</small><strong class="green">'+projectedNetHtml+'</strong></div><div class="funding-stat"><small>Active funding contracts</small><strong>'+activeCount+'</strong></div></div>'+
              '<div class="funding-kyc"><strong>KYC status:</strong> '+safe(statusLabel(data.funder?.kyc_status||"Not started"))+' · '+safe(data.funder?.status||"No funder profile")+'. A verified profile is required before a formal commitment can be submitted.</div>'+
              '<div class="section-head"><h2>Your funding portfolio</h2><p>Principal, locked return terms, estimated deductions, maturity and settlement progress.</p></div>'+commitmentRows+
              '<div class="section-head"><h2>Approved funding opportunities</h2><p>Compare terms and calculate a potential return before expressing interest.</p></div>'+offerCards+
              '<div class="notice"><strong>Important:</strong> Fixed total-period returns are calculated once for the whole term. Annualised returns use simple pro-rating on the approved day-count basis. Compounding is not applied. Taxes and deductions are shown only when they are part of approved, signed terms. Projected returns are not guarantees.</div></section>';
        }

        window.calculateFundingOffer = function(id,rate,term,type,basis) {
            const input=document.getElementById("funding-amount-"+id);
            const principal=Number(input?.value||0);
            const denominator=basis==="actual_360"||basis==="30_360"?360:365;
            const gross=type==="annualised_simple"?principal*(rate/100)*(term/denominator):principal*(rate/100);
            const tax=gross*Number(input?.dataset.tax||0)/100;
            let extras=[];try{extras=JSON.parse(input?.dataset.deductions||"[]");}catch(_){}
            const other=Array.isArray(extras)?extras.reduce((sum,item)=>sum+(item.type==="fixed"?Number(item.amount||0):gross*Number(item.rate??item.percentage??0)/100),0):0;
            const deductions=tax+other,net=Math.max(0,gross-deductions);
            const fmt=value=>new Intl.NumberFormat("en-KE",{style:"currency",currency:input?.dataset.currency||"KES"}).format(value);
            const target=document.getElementById("funding-calc-"+id);
            if(target)target.innerHTML="<span>Gross "+fmt(gross)+" · Deductions "+fmt(deductions)+"</span><strong>Net return "+fmt(net)+" · Total at maturity "+fmt(principal+net)+"</strong>";
        };
        window.expressFundingInterest = async function(opportunityId) {
            const principal=Number(document.getElementById("funding-amount-"+opportunityId)?.value||0);
            if(!Number.isFinite(principal)||principal<=0)return alert("Enter a valid amount.");
            if(!document.getElementById("funding-consent-"+opportunityId)?.checked)return alert("Please confirm the funding data consent checkbox first.");
            const {data,error}=await supabaseClient.functions.invoke("funding-management",{body:{action:"investor_express_interest",opportunity_id:opportunityId,principal_amount:principal,idempotency_key:crypto.randomUUID(),consent:true}});
            if(error||!data?.success)return alert(data?.error||error?.message||"Unable to submit interest.");
            alert("Interest submitted. This is not yet a funding commitment or payment.");await loadInvestments();
        };
        window.submitFundingCommitment = async function(id) {
            if(!confirm("Submit this as a formal commitment request? KYC must be verified. A signed agreement and verified payment are still required."))return;
            const {data,error}=await supabaseClient.functions.invoke("funding-management",{body:{action:"investor_submit_commitment",id}});
            if(error||!data?.success)return alert(data?.error||error?.message||"Unable to submit commitment.");
            alert("Commitment submitted for agreement preparation.");await loadInvestments();
        };

        window.submitFundingMaturityInstruction = async function(sourceCommitmentId) {
            const kind=document.getElementById("maturity-type-"+sourceCommitmentId)?.value||"";
            const target=document.getElementById("maturity-opportunity-"+sourceCommitmentId)?.value||"";
            const partial=Number(document.getElementById("maturity-amount-"+sourceCommitmentId)?.value||0);
            if(kind!=="withdraw"&&!target)return alert("Select the new approved funding opportunity.");
            if(kind==="reinvest_partial"&&(!Number.isFinite(partial)||partial<=0))return alert("Enter the amount you want to reinvest.");
            const labels={withdraw:"withdraw principal and return",reinvest_principal:"reinvest principal only",reinvest_principal_and_return:"reinvest principal plus return",reinvest_partial:"reinvest part of the maturity amount"};
            if(!confirm("Submit your instruction to "+labels[kind]+"? This is a request for review, not an automatic payout or renewal."))return;
            const payload={action:"investor_request_renewal",source_commitment_id:sourceCommitmentId,election_type:kind};
            if(kind!=="withdraw")payload.target_opportunity_id=Number(target);
            if(kind==="reinvest_partial")payload.requested_amount=partial;
            const {data,error}=await supabaseClient.functions.invoke("funding-management",{body:payload});
            if(error||!data?.success)return alert(data?.error||error?.message||"Unable to submit maturity instruction.");
            alert("Your maturity instruction has been submitted for review.");
            await loadInvestments();
        };

        function renderFunderOnly(fundingData) {
            content.innerHTML = `
                <section class="heading">
                    <div class="eyebrow">FUNDER RELATIONS</div>
                    <h1>Short-Term Funding</h1>
                    <p class="subtitle">View approved opportunities, calculate returns and track your funding portfolio.</p>
                </section>
                ${renderFundingSection(fundingData)}
            `;
            if (window.location.hash === "#short-term-funding") {
                document.getElementById("short-term-funding")?.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        function renderInvestor(investor, investments, transactions, fundingData = {}) {
            const totalCapital = investments.reduce(
                (sum, item) => sum + Number(item.amount || 0), 0
            );

            const totalFees = investments.reduce(
                (sum, item) => sum + Number(item.fee || 0), 0
            );

            const equity = Number(investor.equity || 0);
            const shareChanges = transactions.length;

            content.innerHTML = `
  <section class="investor-hero">
   <div>
    <div class="investor-name">${safe(investor.name||"Investor")}</div>
    <div class="investor-number">
     Investor number: ${display(investor.investor_number)}
     · Joined: ${dateText(investor.joined_date)}
    </div>
   </div>
   <span class="investor-badge">${safe(investor.status||"Active")}</span>
  </section>

  <section class="summary">
   <div class="stat">
    <div class="stat-label">Recorded Capital Contributions</div>
    <div class="stat-value cyan">${money(totalCapital)}</div>
   </div>
   <div class="stat">
    <div class="stat-label">Current Recorded Equity</div>
    <div class="stat-value green">${money(equity)}</div>
   </div>
   <div class="stat">
    <div class="stat-label">Shareholding Transactions</div>
    <div class="stat-value yellow">${shareChanges}</div>
   </div>
  </section>

  <section class="section-head">
   <h2>Capital contribution history</h2>
   <p>Your recorded investment transactions</p>
  </section>

  ${investments.length?`
   <div class="table-wrap">
    <table>
     <thead>
      <tr>
       <th>Date</th>
       <th>Transaction type</th>
       <th>Amount</th>
       <th>Fee</th>
       <th>Reference</th>
      </tr>
     </thead>
     <tbody>
      ${investments.map(item=>`
       <tr>
        <td>${dateText(item.date)}</td>
        <td><span class="action-tag">${safe(item.type||"Investment")}</span></td>
        <td class="amount">${money(item.amount)}</td>
        <td>${money(item.fee)}</td>
        <td>${display(item.reference)}</td>
       </tr>
      `).join("")}
     </tbody>
    </table>
   </div>
  `:`
   <div class="empty">
    <div style="font-size:32px;margin-bottom:10px">💼</div>
    <strong>No capital contributions found</strong>
    <p>Your recorded investment contributions will appear here.</p>
   </div>
  `}

  <section class="section-head">
   <h2>Shareholding history</h2>
   <p>Recorded changes to your equity position</p>
  </section>

  ${transactions.length?`
   <div class="table-wrap">
    <table>
     <thead>
      <tr>
       <th>Date</th>
       <th>Action</th>
       <th>Equity before</th>
       <th>Equity after</th>
       <th>Change</th>
       <th>Ownership after</th>
      </tr>
     </thead>
     <tbody>
      ${transactions.map(item=>`
       <tr>
        <td>${dateText(item.date)}</td>
        <td><span class="action-tag">${safe(item.action||"Update")}</span></td>
        <td>${money(item.equity_before)}</td>
        <td>${money(item.equity_after)}</td>
        <td>${money(item.delta)}</td>
        <td>${item.pct_after===null||item.pct_after===undefined?"—":safe(item.pct_after)+"%"}</td>
       </tr>
      `).join("")}
     </tbody>
    </table>
   </div>
  `:`
   <div class="empty">
    <strong>No shareholding changes recorded</strong>
    <p>Your equity history will appear here when transactions are recorded.</p>
   </div>
  `}

  <div class="notice">
   <strong>Investor record protection</strong><br>
   These figures are taken from your official STARLINK investment and shareholding records. This page is read-only. Only authorized company administrators can verify contributions or adjust equity records.
   <br><br>
   The capital contribution total is the sum of your non-deleted investment entries. It is not necessarily the same as your current equity value. Ownership percentage is not calculated here because the official company-wide equity denominator must come from the approved capitalization records.
  </div>
  ${renderFundingSection(fundingData)}
 `;
            if (window.location.hash === "#short-term-funding") {
                document.getElementById("short-term-funding")?.scrollIntoView({ behavior: "smooth", block: "start" });
            }
}

async function logout(){
 const {error}=await supabaseClient.auth.signOut();
 if(error){
  alert("Unable to sign out. Please try again.");
  return;
 }
 window.location.href="../login.html";
}

loadInvestments();
    </script>
</body>

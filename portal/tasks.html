<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks | STARLINK ULTRANET</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
         :root {
            --bg: #080f1d;
            --panel: #111c2e;
            --panel2: #16243a;
            --line: #263750;
            --text: #edf4ff;
            --muted: #91a3bd;
            --cyan: #22d3ee;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .layout {
            max-width: 1250px;
            margin: auto;
            padding: 30px 22px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 25px;
            margin: 0 0 7px;
        }
        
        .header p {
            color: var(--muted);
            margin: 0;
            font-size: 13px;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        
        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: var(--cyan);
            color: #06121e;
        }
        
        .btn-secondary {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--line);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        
        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 18px;
        }
        
        .stat small {
            color: var(--muted);
            font-size: 12px;
        }
        
        .stat strong {
            display: block;
            font-size: 25px;
            margin-top: 9px;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        
        .toolbar input,
        .toolbar select {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px;
            border-radius: 9px;
            min-width: 190px;
            outline: none;
        }
        
        .toolbar input {
            flex: 1;
        }
        
        .task-list {
            display: grid;
            gap: 13px;
        }
        
        .task {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 19px;
        }
        
        .task-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .task h3 {
            margin: 0 0 8px;
            font-size: 17px;
        }
        
        .task-description {
            color: #b6c5da;
            font-size: 13px;
            line-height: 1.65;
        }
        
        .meta {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin: 14px 0;
            color: var(--muted);
            font-size: 12px;
        }
        
        .tag {
            padding: 5px 9px;
            border-radius: 20px;
            background: var(--panel2);
            font-size: 11px;
            text-transform: capitalize;
        }
        
        .priority-high {
            color: #fca5a5;
            background: #451b29;
        }
        
        .priority-medium {
            color: #fcd34d;
            background: #423116;
        }
        
        .priority-low {
            color: #86efac;
            background: #123a2a;
        }
        
        .status-pending {
            color: #fcd34d;
        }
        
        .status-progress {
            color: #7dd3fc;
        }
        
        .status-completed {
            color: #86efac;
        }
        
        .status-overdue {
            color: #fca5a5;
        }
        
        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 7px;
        }
        
        .progress {
            height: 7px;
            background: #263750;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .progress div {
            height: 100%;
            background: var(--cyan);
            border-radius: 20px;
        }
        
        .details {
            border-top: 1px solid var(--line);
            margin-top: 15px;
            padding-top: 13px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        
        .details strong {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        
        .details p {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        
        .task-controls {
            border-top: 1px solid var(--line);
            margin-top: 18px;
            padding-top: 16px;
        }
        
        .task-controls h4 {
            font-size: 13px;
            margin: 0 0 12px;
        }
        
        .task-controls button {
            background: var(--cyan);
            color: #06121e;
            margin: 4px 5px 4px 0;
        }
        
        .task-controls button.secondary {
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--line);
        }
        
        .task-controls button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        
        .progress-control {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        
        .progress-control input {
            flex: 1;
            min-width: 140px;
            accent-color: var(--cyan);
        }
        
        .comment-box {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        
        .comment-box input {
            flex: 1;
            min-width: 0;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 11px;
        }
        
        .comment-history {
            margin-top: 14px;
        }
        
        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
        
        .comment-item strong {
            color: var(--cyan);
        }
        
        .empty,
        .message {
            padding: 35px;
            text-align: center;
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 12px;
            color: var(--muted);
        }
        
        .message.error {
            color: #fca5a5;
        }
        
        .loading {
            padding: 35px;
            text-align: center;
            color: var(--muted);
        }
        
        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-top: 30px;
        }
        
        @media(max-width:750px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .details {
                grid-template-columns: 1fr;
            }
            .layout {
                padding: 20px 13px;
            }
        }
        
        @media(max-width:400px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .stat {
                padding: 13px;
            }
            .stat strong {
                font-size: 21px;
            }
            .comment-box {
                flex-direction: column;
            }
            .comment-box button {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="portal-ui.css">
</head>

<body>

    <div class="layout">

        <header class="header">
            <div>
                <h1><i class="fa-solid fa-list-check"></i> My Tasks</h1>
                <p id="welcome">Your assigned work and progress</p>
            </div>

            <div class="actions">
                <button class="btn-secondary" id="refreshButton">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>

                <button class="btn-primary" id="dashboardButton">
                <i class="fa-solid fa-house"></i> Dashboard
            </button>
            </div>
        </header>

        <section class="stats">
            <div class="stat">
                <small>Total Tasks</small>
                <strong id="total">0</strong>
            </div>

            <div class="stat">
                <small>Pending</small>
                <strong id="pending">0</strong>
            </div>

            <div class="stat">
                <small>In Progress</small>
                <strong id="inProgress">0</strong>
            </div>

            <div class="stat">
                <small>Completed</small>
                <strong id="completed">0</strong>
            </div>
        </section>

        <section class="toolbar">
            <input id="search" type="search" placeholder="Search task title or description...">

            <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="assigned">Assigned</option>
            <option value="accepted">Accepted</option>
            <option value="in_progress">In Progress</option>
            <option value="awaiting_review">Awaiting Review</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="on_hold">On Hold</option>
            <option value="completed">Completed</option>
        </select>

            <select id="priorityFilter">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        </section>

        <div id="message" class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i> Loading your tasks...
        </div>

        <section id="taskList" class="task-list"></section>

        <div class="footer">
            STARLINK ULTRANET LLC · PERSONAL EMPLOYEE PORTAL
        </div>

    </div>

    <script>
        "use strict";

        /* =========================================
           SUPABASE CONFIGURATION
        ========================================= */

        const SUPABASE_URL =
            "https://ujhasodlnduoozlmxdbv.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_DK0i6IuTFcE6_g1P6gG_-A_IkwguvIL";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        let currentTasks = [];
        let staffId = null;
        let loadingTasks = false;

        function el(id) {
            return document.getElementById(id);
        }

        /* =========================================
           SAFE DISPLAY HELPERS
        ========================================= */

        function escapeHTML(value) {
            return String(value === null || value === undefined ? "" : value)
                .replace(/[&<>"']/g, function(char) {
                    const replacements = {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#039;"
                    };

                    return replacements[char];
                });
        }

        function normalise(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/_/g, " ");
        }

        function formatDate(value) {
            if (!value) return "Not specified";

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return "Not specified";
            }

            return date.toLocaleDateString("en-KE", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function isOverdue(task) {
            if (!task.deadline) return false;

            const deadline = new Date(task.deadline + "T23:59:59");

            return deadline < new Date() &&
                normalise(task.status) !== "completed";
        }

        function showMessage(message, isError) {
            el("message").className = isError ?
                "message error" :
                "message";

            el("message").textContent = message;
            el("message").style.display = "block";
        }

        /* =========================================
           VERIFY EMPLOYEE ACCOUNT
        ========================================= */

        /* =========================================
           TASK EDGE FUNCTION CONNECTION
        ========================================= */

        async function taskAction(payload) {

            const sessionResult = await db.auth.getSession();

            if (
                sessionResult.error ||
                !sessionResult.data.session
            ) {
                window.location.href = "../login.html";
                return null;
            }

            const result = await db.functions.invoke(
                "personal-portal-tasks", {
                    body: payload
                }
            );

            if (result.error) {
                console.error("Task function error:", result.error);

                let message = "Task action failed.";

                if (result.data && result.data.error) {
                    message = result.data.error;
                } else if (result.error.message) {
                    message = result.error.message;
                }

                throw new Error(message);
            }

            if (!result.data || !result.data.success) {
                throw new Error(
                    result.data && result.data.error ?
                    result.data.error :
                    "Unable to complete the task action."
                );
            }

            return result.data;
        }

        /* =========================================
           LOAD TASKS
        ========================================= */

        async function loadTasks() {

            if (loadingTasks) return;
            loadingTasks = true;
            showMessage("Loading your assigned tasks...");

            try {
                const result = await taskAction({ action: "list_tasks" });
                currentTasks = Array.isArray(result.tasks) ? result.tasks : [];

                el("message").style.display = "none";
                el("welcome").textContent =
                    "You currently have " + currentTasks.length + " assigned task(s).";

                updateStatistics();
                renderTasks();

            } catch (error) {
                console.error("Task loading error:", error);
                showMessage(
                    error.message ||
                    "Unable to load your tasks. Please contact management.",
                    true
                );
            } finally {
                loadingTasks = false;
            }
        }

        /* =========================================
           TASK STATISTICS
        ========================================= */

        function updateStatistics() {

            function countStatus(status) {
                return currentTasks.filter(function(task) {
                    return normalise(task.status) === status;
                }).length;
            }

            el("total").textContent = currentTasks.length;

            el("pending").textContent =
                countStatus("assigned") +
                countStatus("pending");

            el("inProgress").textContent =
                countStatus("accepted") +
                countStatus("in progress");

            el("completed").textContent =
                countStatus("completed");
        }

        /* =========================================
           ACCEPT TASK
        ========================================= */

        async function acceptTask(taskId) {

            try {

                await taskAction({
                    action: "update_progress",
                    task_id: taskId,
                    progress_pct: 0,
                    status: "accepted"
                });

                alert("Task accepted successfully.");

                await loadTasks();

            } catch (error) {
                alert(error.message);
            }
        }

        /* =========================================
           START OR RESUME TASK
        ========================================= */

        async function startTask(taskId) {

            const task = currentTasks.find(function(item) {
                return String(item.id) === String(taskId);
            });

            if (!task) {
                alert("Task could not be found.");
                return;
            }

            try {

                await taskAction({
                    action: "update_progress",
                    task_id: taskId,
                    progress_pct: Number(task.progress_pct || 0),
                    status: "in_progress"
                });

                alert("Task moved to In Progress.");

                await loadTasks();

            } catch (error) {
                alert(error.message);
            }
        }

        /* =========================================
           SAVE TASK PROGRESS
        ========================================= */

        async function saveTaskProgress(taskId) {

            const slider = document.getElementById(
                "progress-" + taskId
            );

            if (!slider) return;

            const progress = Number(slider.value);

            try {

                await taskAction({
                    action: "update_progress",
                    task_id: taskId,
                    progress_pct: progress
                });

                alert("Task progress updated.");

                await loadTasks();

            } catch (error) {
                alert(error.message);
            }
        }

        /* =========================================
           SUBMIT TASK FOR REVIEW
        ========================================= */

        async function requestTaskReview(taskId) {

            const confirmed = confirm(
                "Submit this task for management review?"
            );

            if (!confirmed) return;

            try {

                await taskAction({
                    action: "update_progress",
                    task_id: taskId,
                    progress_pct: 100,
                    status: "awaiting_review"
                });

                alert(
                    "Task submitted successfully for management review."
                );

                await loadTasks();

            } catch (error) {
                alert(error.message);
            }
        }

        /* =========================================
           ADD TASK COMMENT
        ========================================= */

        async function addTaskComment(taskId) {

            const input = document.getElementById(
                "comment-" + taskId
            );

            if (!input) return;

            const comment = input.value.trim();

            if (!comment) {
                alert("Enter a comment first.");
                return;
            }

            try {

                await taskAction({
                    action: "add_comment",
                    task_id: taskId,
                    comment: comment
                });

                input.value = "";

                await loadTaskComments(taskId);

                alert("Comment added successfully.");

            } catch (error) {
                alert(error.message);
            }
        }

        /* =========================================
           LOAD TASK COMMENTS
        ========================================= */

        async function loadTaskComments(taskId) {

            const container = document.getElementById(
                "comments-" + taskId
            );

            if (!container) return;

            try {

                const result = await taskAction({
                    action: "list_comments",
                    task_id: taskId
                });

                const comments = result.comments || [];

                if (!comments.length) {
                    container.innerHTML =
                        '<p class="task-description">No updates yet.</p>';

                    return;
                }

                container.innerHTML = comments.map(function(comment) {

                    const created = comment.created_at ?
                        new Date(comment.created_at).toLocaleString("en-KE") :
                        "";

                    return `
                <div class="comment-item">
                    <strong>${escapeHTML(comment.author)}</strong>
                    <span> · ${escapeHTML(created)}</span>
                    <div>${escapeHTML(comment.body)}</div>
                </div>
            `;

                }).join("");

            } catch (error) {

                console.error("Task comments:", error);

                container.textContent =
                    "Unable to load task updates.";
            }
        }

        /* =========================================
           RENDER TASKS
        ========================================= */

        function renderTasks() {

            const search = el("search").value.trim().toLowerCase();

            const selectedStatus = normalise(
                el("statusFilter").value
            );

            const selectedPriority = normalise(
                el("priorityFilter").value
            );

            const filtered = currentTasks.filter(function(task) {

                const searchable = [
                    task.title,
                    task.description,
                    task.instructions,
                    task.expected_result,
                    task.notes
                ].join(" ").toLowerCase();

                return (
                    (!search || searchable.includes(search)) &&
                    (!selectedStatus ||
                        normalise(task.status) === selectedStatus) &&
                    (!selectedPriority ||
                        normalise(task.priority) === selectedPriority)
                );
            });

            if (!filtered.length) {

                el("taskList").innerHTML = "";

                showMessage(
                    currentTasks.length ?
                    "No tasks match your search or filters." :
                    "You currently have no assigned tasks."
                );

                return;
            }

            el("message").style.display = "none";

            el("taskList").innerHTML = filtered.map(function(task) {

                const taskId = String(task.id);
                const taskStatus = normalise(task.status);
                const priority = normalise(task.priority);

                const progress = Math.min(
                    100,
                    Math.max(0, Number(task.progress_pct || 0))
                );

                const overdue = isOverdue(task);

                let statusClass = "status-pending";

                if (taskStatus === "completed") {
                    statusClass = "status-completed";
                } else if (taskStatus === "in progress") {
                    statusClass = "status-progress";
                } else if (overdue) {
                    statusClass = "status-overdue";
                }

                let priorityClass = "";

                if (
                    priority === "high" ||
                    priority === "medium" ||
                    priority === "low"
                ) {
                    priorityClass = "priority-" + priority;
                }

                let controls = "";

                if (taskStatus === "assigned") {

                    controls = `
                <button data-action="accept" data-id="${escapeHTML(taskId)}">
                    <i class="fa-solid fa-check"></i>
                    Accept Task
                </button>
            `;

                } else if (taskStatus === "accepted") {

                    controls = `
                <button data-action="start" data-id="${escapeHTML(taskId)}">
                    <i class="fa-solid fa-play"></i>
                    Start Task
                </button>

                <div class="progress-control">
                    <label>Progress: ${progress}%</label>

                    <input
                        type="range"
                        min="0"
                        max="99"
                        value="${progress}"
                        id="progress-${escapeHTML(taskId)}"
                    >

                    <button
                        class="secondary"
                        data-action="save"
                        data-id="${escapeHTML(taskId)}"
                    >
                        Save Progress
                    </button>
                </div>
            `;

                } else if (taskStatus === "in progress") {

                    controls = `
                <div class="progress-control">
                    <label>Progress: ${progress}%</label>

                    <input
                        type="range"
                        min="0"
                        max="99"
                        value="${progress}"
                        id="progress-${escapeHTML(taskId)}"
                    >

                    <button
                        class="secondary"
                        data-action="save"
                        data-id="${escapeHTML(taskId)}"
                    >
                        Save Progress
                    </button>
                </div>

                <button data-action="review" data-id="${escapeHTML(taskId)}">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit for Review
                </button>
            `;

                } else if (
                    taskStatus === "rejected" ||
                    taskStatus === "on hold"
                ) {

                    controls = `
                <button data-action="resume" data-id="${escapeHTML(taskId)}">
                    <i class="fa-solid fa-play"></i>
                    Resume Task
                </button>
            `;

                } else if (taskStatus === "awaiting review") {

                    controls = `
                <p class="task-description">
                    <i class="fa-solid fa-hourglass-half"></i>
                    Submitted. Waiting for management review.
                </p>
            `;

                } else if (taskStatus === "approved") {

                    controls = `
                <p class="task-description">
                    Your task has been approved and is awaiting completion.
                </p>
            `;

                } else if (taskStatus === "completed") {

                    controls = `
                <p class="task-description">
                    <i class="fa-solid fa-circle-check"></i>
                    This task has been completed.
                </p>
            `;

                }

                const assignedDate = task.start_date ?
                    formatDate(task.start_date) :
                    task.created_at ?
                    formatDate(task.created_at) :
                    "Not specified";

                return `
        <article class="task">

            <div class="task-top">

                <div>
                    <h3>${escapeHTML(task.title)}</h3>

                    <div class="task-description">
                        ${escapeHTML(
                            task.description ||
                            "No description provided."
                        )}
                    </div>
                </div>

                <span class="tag ${priorityClass}">
                    ${escapeHTML(task.priority || "Unspecified")}
                    priority
                </span>

            </div>

            <div class="meta">

                <span>
                    <i class="fa-regular fa-calendar"></i>
                    Assigned: ${escapeHTML(assignedDate)}
                </span>

                <span>
                    <i class="fa-regular fa-clock"></i>
                    Deadline: ${escapeHTML(formatDate(task.deadline))}
                </span>

                <span class="tag ${statusClass}">
                    ${escapeHTML(overdue ? "Overdue" : task.status)}
                </span>

            </div>

            <div class="progress-row">
                <span>Task progress</span>
                <strong>${progress}%</strong>
            </div>

            <div class="progress">
                <div style="width:${progress}%"></div>
            </div>

            <div class="details">

                <div>
                    <strong>INSTRUCTIONS</strong>
                    <p>${escapeHTML(
                        task.instructions ||
                        "No additional instructions."
                    )}</p>
                </div>

                <div>
                    <strong>EXPECTED RESULT</strong>
                    <p>${escapeHTML(
                        task.expected_result ||
                        "Not specified."
                    )}</p>
                </div>

                <div>
                    <strong>ADDITIONAL NOTES</strong>
                    <p>${escapeHTML(
                        task.notes ||
                        "No additional notes."
                    )}</p>
                </div>

                <div>
                    <strong>TASK REFERENCE</strong>
                    <p>${escapeHTML(taskId)}</p>
                </div>

            </div>

            <div class="task-controls">

                <h4>
                    <i class="fa-solid fa-sliders"></i>
                    Task Actions
                </h4>

                ${controls}

                <div class="comment-box">

                    <input
                        id="comment-${escapeHTML(taskId)}"
                        maxlength="3000"
                        placeholder="Add a task update or comment..."
                    >

                    <button
                        data-action="comment"
                        data-id="${escapeHTML(taskId)}"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        Send
                    </button>

                </div>

                <div
                    class="comment-history"
                    id="comments-${escapeHTML(taskId)}"
                >
                    <p class="task-description">
                        Loading task updates...
                    </p>
                </div>

            </div>

        </article>
        `;

            }).join("");

            /* Attach task action events */

            el("taskList")
                .querySelectorAll("[data-action]")
                .forEach(function(button) {

                    button.addEventListener("click", async function() {

                        const action = button.dataset.action;
                        const taskId = button.dataset.id;

                        button.disabled = true;

                        try {

                            if (action === "accept") {
                                await acceptTask(taskId);
                            }

                            if (action === "start") {
                                await startTask(taskId);
                            }

                            if (action === "save") {
                                await saveTaskProgress(taskId);
                            }

                            if (action === "review") {
                                await requestTaskReview(taskId);
                            }

                            if (action === "comment") {
                                await addTaskComment(taskId);
                            }

                            if (action === "resume") {
                                await startTask(taskId);
                            }

                        } finally {
                            button.disabled = false;
                        }

                    });

                });

            /* Load comments for displayed tasks */

            filtered.forEach(function(task) {
                loadTaskComments(task.id);
            });
        }

        /* =========================================
           FILTER EVENTS
        ========================================= */

        el("search").addEventListener("input", function() {
            renderTasks();
        });

        el("statusFilter").addEventListener("change", function() {
            renderTasks();
        });

        el("priorityFilter").addEventListener("change", function() {
            renderTasks();
        });

        /* =========================================
           NAVIGATION
        ========================================= */

        function goDashboard() {

            if (
                window.parent &&
                window.parent !== window &&
                typeof window.parent.openPortalPage === "function"
            ) {
                window.parent.openPortalPage("dashboard");
            } else {
                window.location.href = "dashboard.html";
            }
        }

        el("dashboardButton").addEventListener("click", goDashboard);

        el("refreshButton").addEventListener("click", function() {
            loadTasks();
        });

        /* =========================================
           INITIALISE PAGE
        ========================================= */

        loadTasks();
    </script>

</body>

</html>

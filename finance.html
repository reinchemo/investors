<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>STARLINK · Finance Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem 0.8rem;
            position: relative;
            overflow-x: hidden;
            color: #e8eef7;
        }
        
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(-45deg, #0a0e1a, #0f1a2e, #14213a, #0d2438, #1a1030);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatOrb 22s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #4fb6a8 0%, transparent 70%);
            top: -120px;
            left: -80px;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7a5af8 0%, transparent 70%);
            bottom: -180px;
            right: -120px;
            animation-delay: -7s;
        }
        
        .orb-3 {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #c89a5b 0%, transparent 70%);
            top: 40%;
            right: 30%;
            animation-delay: -14s;
            opacity: 0.22;
        }
        
        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-40px, 50px) scale(0.95);
            }
        }
        
        .dashboard {
            max-width: 1400px;
            width: 100%;
            background: linear-gradient(135deg, rgba(20, 32, 52, 0.75) 0%, rgba(15, 26, 46, 0.85) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            box-shadow: 0 32px 80px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(120, 200, 220, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            padding: 1.6rem 1.4rem 2rem;
            border: 1px solid rgba(120, 200, 220, 0.12);
            position: relative;
            animation: cardEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @media (max-width:600px) {
            .dashboard {
                padding: 1.1rem 0.8rem 1.6rem;
                border-radius: 24px;
            }
        }
        
        @media (max-width:400px) {
            .dashboard {
                padding: 0.9rem 0.6rem 1.3rem;
                border-radius: 20px;
            }
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.7rem 0.9rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #f2f0eb;
            letter-spacing: -0.01em;
        }
        
        .brand i {
            color: #4fb6a8;
            font-size: 1.7rem;
            filter: drop-shadow(0 0 12px rgba(79, 182, 168, 0.5));
            animation: dishPulse 3s ease-in-out infinite;
        }
        
        @keyframes dishPulse {
            0%,
            100% {
                transform: rotate(0deg);
                filter: drop-shadow(0 0 12px rgba(79, 182, 168, 0.5));
            }
            50% {
                transform: rotate(6deg);
                filter: drop-shadow(0 0 20px rgba(79, 182, 168, 0.85));
            }
        }
        
        .brand span {
            background: linear-gradient(90deg, #e8eef7 0%, #5fc7bc 30%, #c89a5b 60%, #e8eef7 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 4s linear infinite;
        }
        
        @keyframes shimmerText {
            to {
                background-position: 200% center;
            }
        }
        
        .nav-actions {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
        }
        
        .btn {
            border: 1px solid rgba(120, 200, 220, 0.18);
            padding: 0.55rem 1.1rem;
            border-radius: 60px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, background 0.3s ease, color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 40px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            color: #c7d5e6;
            isolation: isolate;
        }
        
        .btn i {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(95, 199, 188, 0.4);
            color: #e8eef7;
            box-shadow: 0 10px 24px -10px rgba(79, 182, 168, 0.4);
        }
        
        .btn:hover i {
            transform: scale(1.15) rotate(-6deg);
        }
        
        .btn:active {
            transform: translateY(0) scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1a5a9c 0%, #2a7ac4 100%);
            color: white;
            border-color: rgba(120, 180, 255, 0.3);
            box-shadow: 0 8px 20px -8px rgba(42, 122, 196, 0.55);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2068b0 0%, #3a8ad4 100%);
            box-shadow: 0 14px 30px -10px rgba(42, 122, 196, 0.75);
        }
        
        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: #c7d5e6;
        }
        
        .btn-ghost:hover {
            background: rgba(120, 200, 220, 0.1);
        }
        
        .btn-home {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.25) 0%, rgba(200, 154, 91, 0.08) 100%);
            color: #f4c98d;
            border-color: rgba(200, 154, 91, 0.55);
            box-shadow: 0 8px 20px -8px rgba(200, 154, 91, 0.5);
            font-weight: 700;
        }
        
        .btn-home:hover {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.4) 0%, rgba(200, 154, 91, 0.15) 100%);
            color: #fbe0b0;
            border-color: rgba(200, 154, 91, 0.85);
            transform: translateY(-2px) translateX(-3px);
        }
        
        .btn-home:hover i {
            transform: translateX(-4px) scale(1.15);
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        
        @media (max-width:480px) {
            .brand {
                font-size: 1.15rem;
            }
            .brand i {
                font-size: 1.4rem;
            }
            .btn {
                padding: 0.45rem 0.85rem;
                font-size: 0.75rem;
                min-height: 36px;
            }
        }
        
        .tabs {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            padding: 0.35rem;
            background: rgba(15, 26, 46, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(120, 200, 220, 0.12);
        }
        
        .tab {
            border: none;
            background: transparent;
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            color: #7f9bb8;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        
        .tab:hover {
            color: #c7d5e6;
            background: rgba(120, 200, 220, 0.08);
        }
        
        .tab.active {
            background: linear-gradient(135deg, rgba(95, 199, 188, 0.25), rgba(95, 199, 188, 0.08));
            color: #7fded1;
            box-shadow: 0 4px 12px -6px rgba(95, 199, 188, 0.5);
            border: 1px solid rgba(95, 199, 188, 0.35);
        }
        
        .tab .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: rgba(226, 104, 91, 0.25);
            color: #f0a89f;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
        }
        
        .tab.active .badge {
            background: rgba(226, 104, 91, 0.4);
            color: #fff;
        }
        
        @media (max-width:600px) {
            .tab {
                padding: 0.5rem 0.75rem;
                font-size: 0.72rem;
            }
        }
        
        .view {
            display: none;
        }
        
        .view.active {
            display: block;
            animation: fadeIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .headline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem 0.7rem;
            margin-bottom: 1.4rem;
        }
        
        .headline h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: -0.025em;
            color: #f2f0eb;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .headline h1 i {
            color: #5fc7bc;
            font-size: 1.5rem;
            filter: drop-shadow(0 0 14px rgba(95, 199, 188, 0.55));
        }
        
        .headline h1 small {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 500;
            background: linear-gradient(135deg, rgba(79, 182, 168, 0.18), rgba(122, 90, 248, 0.15));
            padding: 0.25rem 0.85rem;
            border-radius: 40px;
            color: #7fded1;
            border: 1px solid rgba(79, 182, 168, 0.3);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        @media (max-width:480px) {
            .headline h1 {
                font-size: 1.3rem;
            }
        }
        
        .info-banner {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.15), rgba(200, 154, 91, 0.05));
            border: 1px solid rgba(200, 154, 91, 0.35);
            color: #e8b879;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.78rem;
            margin-bottom: 1.2rem;
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            line-height: 1.5;
        }
        
        .info-banner i {
            margin-top: 2px;
            font-size: 1rem;
        }
        
        .info-banner strong {
            color: #f4c98d;
        }
        
        .summary-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 0.8rem 0 1.6rem;
        }
        
        .summary-card {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.55) 0%, rgba(20, 32, 52, 0.65) 100%);
            border: 1px solid rgba(120, 200, 220, 0.12);
            border-radius: 20px;
            padding: 1rem 1.15rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 26px -14px rgba(0, 0, 0, 0.4);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        
        .summary-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #5fc7bc, transparent);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .summary-card:hover {
            transform: translateY(-4px);
            border-color: rgba(120, 200, 220, 0.3);
            box-shadow: 0 20px 40px -16px rgba(79, 182, 168, 0.35);
        }
        
        .summary-card:hover::after {
            transform: translateX(0);
        }
        
        .summary-card.income {
            background: linear-gradient(135deg, rgba(111, 203, 147, 0.16) 0%, rgba(20, 50, 30, 0.55) 100%);
            border-color: rgba(111, 203, 147, 0.28);
        }
        
        .summary-card.income::after {
            background: linear-gradient(90deg, transparent, #6fcb93, transparent);
        }
        
        .summary-card.income .summary-value {
            color: #7ee0a2;
        }
        
        .summary-card.expense {
            background: linear-gradient(135deg, rgba(226, 104, 91, 0.16) 0%, rgba(60, 20, 20, 0.55) 100%);
            border-color: rgba(226, 104, 91, 0.28);
        }
        
        .summary-card.expense::after {
            background: linear-gradient(90deg, transparent, #e8837a, transparent);
        }
        
        .summary-card.expense .summary-value {
            color: #f0a89f;
        }
        
        .summary-card.capital {
            background: linear-gradient(135deg, rgba(122, 90, 248, 0.16) 0%, rgba(30, 20, 60, 0.55) 100%);
            border-color: rgba(122, 90, 248, 0.28);
        }
        
        .summary-card.capital::after {
            background: linear-gradient(90deg, transparent, #b8a0ff, transparent);
        }
        
        .summary-card.capital .summary-value {
            color: #b8a0ff;
        }
        
        .summary-card .summary-label {
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7f9bb8;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .summary-card .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: #f2f0eb;
            letter-spacing: -0.02em;
        }
        
        .summary-card .summary-sub {
            font-size: 0.7rem;
            color: #7f9bb8;
            margin-top: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        @media (max-width:480px) {
            .summary-card .summary-value {
                font-size: 1.15rem;
            }
        }
        
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            align-items: center;
            padding: 0.8rem;
            background: rgba(15, 26, 46, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(120, 200, 220, 0.12);
            margin-bottom: 1rem;
        }
        
        .filter-bar input,
        .filter-bar select {
            padding: 0.55rem 0.8rem;
            border: 1px solid rgba(120, 200, 220, 0.18);
            border-radius: 10px;
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.04);
            color: #f2f0eb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 38px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        select option,
        select optgroup {
            color: #0a0e1a !important;
            background: #ffffff !important;
        }
        
        .filter-bar input::placeholder {
            color: #5a6f88;
        }
        
        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: #5fc7bc;
            background: rgba(95, 199, 188, 0.06);
            box-shadow: 0 0 0 4px rgba(95, 199, 188, 0.12);
        }
        
        .filter-bar .grow {
            flex: 1;
            min-width: 140px;
        }
        
        @media (max-width:768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar input,
            .filter-bar select,
            .filter-bar button {
                width: 100%;
            }
        }
        
        .table-section {
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.45) 0%, rgba(20, 32, 52, 0.55) 100%);
            border: 1px solid rgba(120, 200, 220, 0.12);
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.4);
        }
        
        .table-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        
        .table-section-header h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.92rem;
            color: #c7d5e6;
            font-weight: 600;
        }
        
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        
        table.data-table th {
            background: rgba(15, 26, 46, 0.55);
            color: #7f9bb8;
            text-align: left;
            padding: 0.8rem 0.9rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
        }
        
        table.data-table td {
            padding: 0.85rem 0.9rem;
            border-top: 1px solid rgba(120, 200, 220, 0.06);
            color: #c7d5e6;
            transition: background 0.3s ease, color 0.3s ease;
            font-size: 0.85rem;
        }
        
        table.data-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(95, 199, 188, 0.06), transparent);
        }
        
        table.data-table tbody tr:hover td {
            color: #f2f0eb;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .id-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #7f9bb8;
        }
        
        .amount-income {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #7ee0a2;
        }
        
        .amount-expense {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #f0a89f;
        }
        
        .amount-capital {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #b8a0ff;
        }
        
        .status-pill {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        
        .status-pill.draft {
            background: rgba(120, 140, 180, 0.18);
            color: #a8b8d4;
            border: 1px solid rgba(120, 140, 180, 0.35);
        }
        
        .status-pill.pending {
            background: rgba(200, 154, 91, 0.18);
            color: #e8b879;
            border: 1px solid rgba(200, 154, 91, 0.35);
        }
        
        .status-pill.approved {
            background: rgba(122, 90, 248, 0.18);
            color: #b8a0ff;
            border: 1px solid rgba(122, 90, 248, 0.35);
        }
        
        .status-pill.posted {
            background: rgba(111, 203, 147, 0.18);
            color: #7ee0a2;
            border: 1px solid rgba(111, 203, 147, 0.35);
        }
        
        .status-pill.rejected {
            background: rgba(226, 104, 91, 0.18);
            color: #f0a89f;
            border: 1px solid rgba(226, 104, 91, 0.35);
        }
        
        .status-pill.reconciled {
            background: rgba(95, 199, 188, 0.18);
            color: #7fded1;
            border: 1px solid rgba(95, 199, 188, 0.35);
        }
        
        .status-pill.unmatched {
            background: rgba(226, 104, 91, 0.18);
            color: #f0a89f;
            border: 1px solid rgba(226, 104, 91, 0.35);
        }
        
        .status-pill.matched {
            background: rgba(200, 154, 91, 0.18);
            color: #e8b879;
            border: 1px solid rgba(200, 154, 91, 0.35);
        }
        
        .status-pill.verified {

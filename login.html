<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARLINK · Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2f0eb;
            background-image: radial-gradient(circle at 0% 0%, rgba(95, 199, 188, 0.12) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(122, 90, 248, 0.12) 0%, transparent 50%);
            padding: 1rem;
        }
        
        .login-box {
            background: linear-gradient(135deg, rgba(24, 38, 60, 0.85), rgba(15, 26, 46, 0.95));
            border: 1px solid rgba(95, 199, 188, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
        }
        
        .login-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            text-align: center;
            color: #5fc7bc;
            margin-bottom: 0.4rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .login-box p {
            text-align: center;
            color: #7f9bb8;
            font-size: 0.82rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #7f9bb8;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(120, 200, 220, 0.2);
            border-radius: 10px;
            color: #f2f0eb;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #5fc7bc;
            background: rgba(95, 199, 188, 0.06);
        }
        
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #1a7a6a, #5fc7bc);
            color: #0a0e1a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(95, 199, 188, 0.5);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error {
            color: #f0a89f;
            font-size: 0.82rem;
            text-align: center;
            margin-bottom: 1rem;
            padding: 0.6rem;
            background: rgba(226, 104, 91, 0.1);
            border: 1px solid rgba(226, 104, 91, 0.3);
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2><i class="fas fa-satellite-dish"></i> STARLINK</h2>
        <p>Sign in to Finance & Equity</p>
        <div class="error" id="errorMsg"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ujhasodlnduoozlmxdbv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DK0i6IuTFcE6_g1P6gG_-A_IkwguvIL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // If already logged in, go straight to the app
        (async() => {
            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();
            if (session) window.location.href = 'index.html';
        })();

        async function doLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            errEl.style.display = 'none';

            if (!email || !password) {
                errEl.textContent = 'Please enter both email and password.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';

            if (error) {
                errEl.textContent = error.message;
                errEl.style.display = 'block';
                return;
            }

            // Confirm the account has a role assigned
            const {
                data: ur,
                error: urErr
            } = await supabaseClient
                .from('user_roles').select('role_id').eq('user_id', data.user.id).maybeSingle();

            if (urErr || !ur || !ur.role_id) {
                await supabaseClient.auth.signOut();
                errEl.textContent = 'Your account has no role assigned. Contact your administrator.';
                errEl.style.display = 'block';
                return;
            }

            window.location.href = 'index.html';
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>

</html>

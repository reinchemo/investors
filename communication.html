<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARLINK LLC · Communication Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0e1a;
            color: #e8eef7;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }
        /* Background Animation */
        
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(-45deg, #0a0e1a, #0f1a2e, #14213a, #0d2438, #1a1030);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* Sidebar */
        
        .sidebar {
            width: 260px;
            background: rgba(15, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(120, 200, 220, 0.1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            z-index: 10;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #f2f0eb;
            margin-bottom: 2rem;
            padding-left: 0.5rem;
        }
        
        .brand i {
            color: #4fb6a8;
            font-size: 1.5rem;
        }
        
        .menu-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #7f9bb8;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
            font-weight: 700;
            margin-top: 1rem;
        }
        
        .menu-item {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #a8b8d4;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        
        .menu-item:hover {
            background: rgba(95, 199, 188, 0.08);
            color: #e8eef7;
        }
        
        .menu-item.active {
            background: linear-gradient(135deg, rgba(95, 199, 188, 0.2), rgba(95, 199, 188, 0.05));
            color: #7fded1;
            border: 1px solid rgba(95, 199, 188, 0.3);
        }
        
        .menu-item i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }
        /* Main Content */
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            position: relative;
            z-index: 1;
        }
        /* Top Nav */
        
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-title h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            color: #f2f0eb;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .page-title p {
            color: #7f9bb8;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
        /* Buttons */
        
        .btn {
            border: 1px solid rgba(120, 200, 220, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1a5a9c, #2a7ac4);
            color: white;
            border-color: rgba(120, 180, 255, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(42, 122, 196, 0.6);
        }
        
        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: #c7d5e6;
        }
        
        .btn-ghost:hover {
            background: rgba(120, 200, 220, 0.1);
        }
        /* Stats Cards */
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.6) 0%, rgba(20, 32, 52, 0.7) 100%);
            border: 1px solid rgba(120, 200, 220, 0.12);
            border-radius: 20px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        
        .stat-info h4 {
            font-size: 0.65rem;
            font-weight: 700;
            color: #7f9bb8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .stat-info h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f2f0eb;
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            background: rgba(95, 199, 188, 0.1);
            color: #7fded1;
        }
        /* Tab Area */
        
        .content-card {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.5) 0%, rgba(20, 32, 52, 0.6) 100%);
            border: 1px solid rgba(120, 200, 220, 0.12);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.4);
        }
        
        .card-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: #c7d5e6;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Table */
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 1rem 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #7f9bb8;
            background: rgba(15, 26, 46, 0.35);
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
            font-weight: 600;
        }
        
        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(120, 200, 220, 0.06);
            font-size: 0.85rem;
            color: #c7d5e6;
        }
        
        tbody tr:hover {
            background: linear-gradient(90deg, rgba(95, 199, 188, 0.06), transparent);
        }
        
        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
        }
        
        .status-sent {
            background: rgba(111, 203, 147, 0.15);
            color: #7ee0a2;
            border: 1px solid rgba(111, 203, 147, 0.3);
        }
        
        .status-failed {
            background: rgba(226, 104, 91, 0.15);
            color: #f0a89f;
            border: 1px solid rgba(226, 104, 91, 0.3);
        }
        
        .status-pending {
            background: rgba(200, 154, 91, 0.15);
            color: #e8b879;
            border: 1px solid rgba(200, 154, 91, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        /* Modal */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 20, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-card {
            background: #121a2a;
            border: 1px solid rgba(120, 200, 220, 0.2);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        .modal-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: #f2f0eb;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand"><i class="fas fa-satellite-dish"></i> STARLINK</div>

        <div class="menu-label">Communication</div>
        <div class="menu-item" onclick="switchTab('email', this)"><i class="fas fa-envelope"></i> Emails</div>
        <div class="menu-item active" onclick="switchTab('sms', this)"><i class="fas fa-sms"></i> SMS</div>
        <div class="menu-item" onclick="switchTab('whatsapp', this)"><i class="fab fa-whatsapp"></i> WhatsApp</div>

        <div class="menu-label">Management</div>
        <div class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to Dashboard</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-nav">
            <div class="page-title">
                <h1 id="pageTitle"><i class="fas fa-sms" style="color:#5fc7bc;"></i> SMS Messages</h1>
                <p id="pageSubtitle">View and manage all SMS communications</p>
            </div>
            <button class="btn btn-primary" id="newTemplateBtn"><i class="fas fa-plus"></i> New Template</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h4>All Messages</h4>
                    <h2 id="statTotal">0</h2>
                </div>
                <div class="stat-icon"><i class="fas fa-comment"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4 style="color:#7ee0a2">Sent</h4>
                    <h2 id="statSent" style="color:#7ee0a2">0</h2>
                </div>
                <div class="stat-icon" style="background:rgba(111,203,147,0.1); color:#7ee0a2"><i class="fas fa-check"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4 style="color:#f0a89f">Failed</h4>
                    <h2 id="statFailed" style="color:#f0a89f">0</h2>
                </div>
                <div class="stat-icon" style="background:rgba(226,104,91,0.1); color:#f0a89f"><i class="fas fa-times"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>This Month</h4>
                    <h2 id="statMonth">0</h2>
                </div>
                <div class="stat-icon" style="background:rgba(200,154,91,0.1); color:#e8b879"><i class="fas fa-calendar-alt"></i></div>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h3><i class="fas fa-list"></i> All Messages</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Message</th>
                        <th>Recipient</th>
                        <th>Date Sent</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="messageTableBody">
                    <!-- Data goes here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ujhasodlnduoozlmxdbv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DK0i6IuTFcE6_g1P6gG_-A_IkwguvIL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLogs = [];

        async function loadLogs() {
            const {
                data,
                error
            } = await supabaseClient.from('notification_logs').select('*').order('created_at', {
                ascending: false
            });
            if (!error && data) {
                allLogs = data;
                renderTable('sms'); // Default to SMS
            } else {
                console.error(error);
            }
        }

        function renderTable(channel) {
            // Update UI headers
            const channelLabel = channel === 'sms' ? 'SMS' : channel === 'email' ? 'Email' : 'WhatsApp';
            const icon = channel === 'sms' ? 'fa-sms' : channel === 'email' ? 'fa-envelope' : 'fa-whatsapp';

            document.getElementById('pageTitle').innerHTML = `<i class="fas ${icon}" style="color:#5fc7bc;"></i> ${channelLabel} Messages`;
            document.getElementById('pageSubtitle').innerText = `View and manage all ${channelLabel} communications with investors`;

            // Filter logs
            const filtered = allLogs.filter(log => log.channel === channel);

            // Calculate Stats
            const total = filtered.length;
            const sent = filtered.filter(l => l.status === 'sent').length;
            const failed = filtered.filter(l => l.status === 'failed').length;
            const thisMonth = filtered.filter(l => new Date(l.created_at).getMonth() === new Date().getMonth()).length;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statSent').innerText = sent;
            document.getElementById('statFailed').innerText = failed;
            document.getElementById('statMonth').innerText = thisMonth;

            // Render Rows
            const tbody = document.getElementById('messageTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 3rem; color: #7f9bb8;"><i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 10px; display: block; opacity:0.5;"></i>No messages found for this channel.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(log => {
                const date = new Date(log.created_at).toLocaleString();
                let statusClass = 'status-pending';
                if (log.status === 'sent') statusClass = 'status-sent';
                if (log.status === 'failed') statusClass = 'status-failed';

                return `
                    <tr>
                        <td><div style="max-width: 350px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${log.message_preview}">${log.message_preview}</div></td>
                        <td style="font-family: 'JetBrains Mono', monospace; color: #7fded1;">${log.recipient_contact}</td>
                        <td style="font-size: 0.75rem; color: #a8b8d4;">${date}</td>
                        <td><span class="status-badge ${statusClass}">${log.status.toUpperCase()}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function switchTab(channel, element) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            renderTable(channel);
        }

        // Init
        loadLogs();
    </script>
</body>

</html>

name: Deploy STARLINK to GitHub Pages
# Deployment refresh requested after the employee username-login update.

on:
  push:
    branches: [master]
    paths:
      - "*.html"
      - "*.js"
      - "*.jpg"
      - "*.png"
      - "*.svg"
      - "*.ico"
      - "portal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare complete static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/portal
          cp index.html login.html finance.html admin.html communication.html _site/
          cp logo.jpg stamp.jpg _site/
          cp mpesa-parser.js router.js _site/
          cp portal/*.html portal/*.css _site/portal/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>STARLINK LLC · equity visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 0.8rem;
            position: relative;
            overflow-x: hidden;
            color: #e8eef7;
        }
        
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(-45deg, #0a0e1a, #0f1a2e, #14213a, #0d2438, #1a1030);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatOrb 22s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #4fb6a8 0%, transparent 70%);
            top: -120px;
            left: -80px;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7a5af8 0%, transparent 70%);
            bottom: -180px;
            right: -120px;
            animation-delay: -7s;
        }
        
        .orb-3 {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #c89a5b 0%, transparent 70%);
            top: 40%;
            right: 30%;
            animation-delay: -14s;
            opacity: 0.22;
        }
        
        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-40px, 50px) scale(0.95);
            }
        }
        
        .dashboard {
            max-width: 1320px;
            width: 100%;
            background: linear-gradient(135deg, rgba(20, 32, 52, 0.75) 0%, rgba(15, 26, 46, 0.85) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            box-shadow: 0 32px 80px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(120, 200, 220, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            padding: 1.6rem 1.4rem 2rem;
            border: 1px solid rgba(120, 200, 220, 0.12);
            position: relative;
            animation: cardEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @media (max-width:600px) {
            .dashboard {
                padding: 1.1rem 0.8rem 1.6rem;
                border-radius: 24px;
            }
        }
        
        @media (max-width:400px) {
            .dashboard {
                padding: 0.9rem 0.6rem 1.3rem;
                border-radius: 20px;
            }
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.7rem 0.9rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(120, 200, 220, 0.1);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #f2f0eb;
            letter-spacing: -0.01em;
        }
        
        .brand i {
            color: #4fb6a8;
            font-size: 1.7rem;
            filter: drop-shadow(0 0 12px rgba(79, 182, 168, 0.5));
            animation: dishPulse 3s ease-in-out infinite;
        }
        
        @keyframes dishPulse {
            0%,
            100% {
                transform: rotate(0deg);
                filter: drop-shadow(0 0 12px rgba(79, 182, 168, 0.5));
            }
            50% {
                transform: rotate(6deg);
                filter: drop-shadow(0 0 20px rgba(79, 182, 168, 0.85));
            }
        }
        
        .brand span {
            background: linear-gradient(90deg, #e8eef7 0%, #5fc7bc 30%, #c89a5b 60%, #e8eef7 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 4s linear infinite;
        }
        
        @keyframes shimmerText {
            to {
                background-position: 200% center;
            }
        }
        
        @media (max-width:480px) {
            .brand {
                font-size: 1.15rem;
            }
            .brand i {
                font-size: 1.4rem;
            }
        }
        
        .nav-actions {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
        }
        
        .nav-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(120, 200, 220, 0.18);
            color: #c7d5e6;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .nav-toggle:hover {
            background: rgba(120, 200, 220, 0.12);
            border-color: rgba(95, 199, 188, 0.5);
            color: #e8eef7;
        }
        
        @media (max-width: 768px) {
            .nav-toggle {
                display: inline-flex;
            }
            .nav-actions {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 0.4rem;
                margin-top: 0.8rem;
                padding-top: 0.8rem;
                border-top: 1px solid rgba(120, 200, 220, 0.1);
            }
            .nav-actions.open {
                display: flex;
            }
            .nav-actions .btn,
            .nav-actions a.btn {
                width: 100%;
                justify-content: flex-start;
                min-height: 44px;
                font-size: 0.85rem;
                padding: 0.7rem 1rem;
                border-radius: 14px;
            }
            .nav-actions .btn i {
                width: 24px;
                text-align: center;
            }
        }
        
        .btn {
            border: 1px solid rgba(120, 200, 220, 0.18);
            padding: 0.55rem 1.1rem;
            border-radius: 60px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, background 0.3s ease, color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 40px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            color: #c7d5e6;
            isolation: isolate;
        }
        
        .btn i {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(95, 199, 188, 0.4);
            color: #e8eef7;
            box-shadow: 0 10px 24px -10px rgba(79, 182, 168, 0.4);
        }
        
        .btn:hover i {
            transform: scale(1.15) rotate(-6deg);
        }
        
        .btn:active {
            transform: translateY(0) scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1a5a9c 0%, #2a7ac4 100%);
            color: white;
            border-color: rgba(120, 180, 255, 0.3);
            box-shadow: 0 8px 20px -8px rgba(42, 122, 196, 0.55);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2068b0 0%, #3a8ad4 100%);
            box-shadow: 0 14px 30px -10px rgba(42, 122, 196, 0.75);
        }
        
        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: #c7d5e6;
        }
        
        .btn-ghost:hover {
            background: rgba(120, 200, 220, 0.1);
            color: #e8eef7;
        }
        
        .btn-home {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.25) 0%, rgba(200, 154, 91, 0.08) 100%);
            color: #f4c98d;
            border-color: rgba(200, 154, 91, 0.55);
            box-shadow: 0 8px 20px -8px rgba(200, 154, 91, 0.5);
            font-weight: 700;
        }
        
        .btn-home:hover {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.4) 0%, rgba(200, 154, 91, 0.15) 100%);
            color: #fbe0b0;
            border-color: rgba(200, 154, 91, 0.85);
            box-shadow: 0 14px 30px -10px rgba(200, 154, 91, 0.75);
            transform: translateY(-2px) translateX(-3px);
        }
        
        .btn-home i {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn-home:hover i {
            transform: translateX(-4px) scale(1.15);
        }
        
        @media (max-width:480px) {
            .btn {
                padding: 0.45rem 0.85rem;
                font-size: 0.75rem;
                min-height: 36px;
            }
        }
        
        .headline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem 0.7rem;
            margin-bottom: 1.6rem;
        }
        
        .headline h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.9rem;
            letter-spacing: -0.025em;
            color: #f2f0eb;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .headline h1 i {
            color: #5fc7bc;
            font-size: 1.7rem;
            filter: drop-shadow(0 0 14px rgba(95, 199, 188, 0.55));
            animation: iconFloat 4s ease-in-out infinite;
        }
        
        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-4px) rotate(2deg);
            }
        }
        
        .headline h1 small {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            background: linear-gradient(135deg, rgba(79, 182, 168, 0.18), rgba(122, 90, 248, 0.15));
            padding: 0.25rem 0.85rem;
            border-radius: 40px;
            color: #7fded1;
            border: 1px solid rgba(79, 182, 168, 0.3);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        @media (max-width:480px) {
            .headline h1 {
                font-size: 1.4rem;
            }
            .headline h1 i {
                font-size: 1.35rem;
            }
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 600;
            color: #7ee0a2;
            background: rgba(111, 203, 147, 0.12);
            border: 1px solid rgba(111, 203, 147, 0.3);
            padding: 0.3rem 0.85rem;
            border-radius: 30px;
            margin-left: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6fcb93;
            position: relative;
        }
        
        .live-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: #6fcb93;
            opacity: 0.6;
            animation: dotWave 1.6s ease-out infinite;
        }
        
        @keyframes dotWave {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }
        
        .live-dot.pulse-once {
            animation: dotPulse 0.9s ease-out;
        }
        
        @keyframes dotPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.8);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .total-badge {
            background: linear-gradient(135deg, rgba(26, 42, 74, 0.95), rgba(15, 26, 46, 0.98));
            color: white;
            padding: 0.55rem 1.5rem;
            border-radius: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 12px 30px -10px rgba(79, 182, 168, 0.5), 0 0 0 1px rgba(95, 199, 188, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(95, 199, 188, 0.3);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .total-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(95, 199, 188, 0.2), transparent);
            transform: translateX(-100%);
            animation: badgeSweep 3.5s ease-in-out infinite;
        }
        
        @keyframes badgeSweep {
            0%,
            100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }
        
        .total-badge.updated {
            animation: badgePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes badgePop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 0 8px rgba(79, 182, 168, 0.15);
            }
            100% {
                transform: scale(1);
            }
        }
        
        @media (max-width:480px) {
            .total-badge {
                font-size: 0.85rem;
                padding: 0.4rem 1rem;
            }
        }
        
        .summary-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 0.8rem 0 1.6rem;
            width: 100%;
        }
        
        @media (max-width: 900px) {
            .summary-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 500px) {
            .summary-row {
                grid-template-columns: 1fr;
            }
        }
        
        .summary-card {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.55) 0%, rgba(20, 32, 52, 0.65) 100%);
            border: 1px solid rgba(120, 200, 220, 0.12);
            border-radius: 20px;
            padding: 1rem 1.15rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 26px -14px rgba(0, 0, 0, 0.4);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        
        .summary-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #5fc7bc, transparent);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .summary-card:hover {
            transform: translateY(-4px);
            border-color: rgba(120, 200, 220, 0.3);
            box-shadow: 0 20px 40px -16px rgba(79, 182, 168, 0.35);
        }
        
        .summary-card:hover::after {
            transform: translateX(0);
        }
        
        .summary-card .summary-label {
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7f9bb8;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .summary-card .summary-label i {
            color: #5fc7bc;
            font-size: 0.85rem;
        }
        
        .summary-card .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.35rem;
            font-weight: 700;
            color: #f2f0eb;
            letter-spacing: -0.02em;
        }
        /* 🆕 NEW STYLES FOR INDEX.HTML DASHBOARD CARDS */
        
        .summary-card.income {
            background: linear-gradient(135deg, rgba(111, 203, 147, 0.12) 0%, rgba(20, 40, 30, 0.6) 100%);
            border: 1px solid rgba(111, 203, 147, 0.25);
        }
        
        .summary-card.income::after {
            background: linear-gradient(90deg, transparent, #6fcb93, transparent);
        }
        
        .summary-card.income .summary-value {
            color: #7ee0a2;
            text-shadow: 0 0 15px rgba(111, 203, 147, 0.2);
        }
        
        .summary-card.expense {
            background: linear-gradient(135deg, rgba(226, 104, 91, 0.12) 0%, rgba(45, 20, 20, 0.6) 100%);
            border: 1px solid rgba(226, 104, 91, 0.25);
        }
        
        .summary-card.expense::after {
            background: linear-gradient(90deg, transparent, #e8837a, transparent);
        }
        
        .summary-card.expense .summary-value {
            color: #f0a89f;
            text-shadow: 0 0 15px rgba(226, 104, 91, 0.2);
        }
        
        .summary-card.capital {
            background: linear-gradient(135deg, rgba(122, 90, 248, 0.12) 0%, rgba(30, 20, 60, 0.6) 100%);
            border: 1px solid rgba(122, 90, 248, 0.25);
        }
        
        .summary-card.capital::after {
            background: linear-gradient(90deg, transparent, #b8a0ff, transparent);
        }
        
        .summary-card.capital .summary-value {
            color: #b8a0ff;
            text-shadow: 0 0 15px rgba(122, 90, 248, 0.2);
        }
        /* 🆕 END OF NEW STYLES */
        
        .summary-card.virtual {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.16) 0%, rgba(60, 40, 20, 0.55) 100%);
            border-color: rgba(200, 154, 91, 0.28);
        }
        
        .summary-card.virtual {
            background: linear-gradient(135deg, rgba(200, 154, 91, 0.16) 0%, rgba(60, 40, 20, 0.55) 100%);
            border-color: rgba(200, 154, 91, 0.28);
        }
        
        .summary-card.virtual::after {
            background: linear-gradient(90deg, transparent, #c89a5b, transparent);
        }
        
        .summary-card.virtual .summary-label i {
            color: #e8b879;
        }
        
        .summary-card.virtual .summary-value {
            color: #f4c98d;
            text-shadow: 0 0 20px rgba(200, 154, 91, 0.35);
        }
        
        .summary-card.virtual:hover {
            box-shadow: 0 20px 40px -16px rgba(200, 154, 91, 0.45);
            border-color: rgba(200, 154, 91, 0.5);
        }
        
        .summary-card.investment {
            background: linear-gradient(135deg, rgba(79, 182, 168, 0.16) 0%, rgba(20, 50, 48, 0.55) 100%);
            border-color: rgba(79, 182, 168, 0.28);
        }
        
        .summary-card.investment::after {
            background: linear-gradient(90deg, transparent, #5fc7bc, transparent);
        }
        
        .summary-card.investment .summary-value {
            color: #7fded1;
            text-shadow: 0 0 20px rgba(79, 182, 168, 0.35);
        }
        
        .summary-card.investment:hover {
            box-shadow: 0 20px 40px -16px rgba(79, 182, 168, 0.5);
            border-color: rgba(79, 182, 168, 0.5);
        }
        
        @media (max-width:480px) {
            .summary-card .summary-value {
                font-size: 1.15rem;
            }
            .summary-card .summary-label {
                font-size: 0.6rem;
            }
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.3rem;
            margin: 1.6rem 0 1.4rem;
        }
        
        @media (max-width:700px) {
            .chart-grid {
                grid-template-columns: 1fr;
                gap: 1.4rem;
            }
        }
        
        .chart-card {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.5) 0%, rgba(20, 32, 52, 0.6) 100%);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 1.2rem 1.2rem 0.7rem;
            border: 1px solid rgba(120, 200, 220, 0.12);
            box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        
        .chart-card:hover {
            transform: translateY(-4px);
            border-color: rgba(120, 200, 220, 0.25);
            box-shadow: 0 24px 50px -18px rgba(79, 182, 168, 0.3);
        }
        
        .chart-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #c7d5e6;
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .chart-card h3 i {
            color: #5fc7bc;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        
        .loading-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(95, 199, 188, 0.15);
            border-top-color: #5fc7bc;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            position: relative;
            box-shadow: 0 0 30px rgba(95, 199, 188, 0.3);
        }
        
        .loading-overlay .spinner::before,
        .loading-overlay .spinner::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        
        .loading-overlay .spinner::before {
            inset: 6px;
            border-top-color: #c89a5b;
            animation: spin 1.4s linear reverse infinite;
        }
        
        .loading-overlay .spinner::after {
            inset: 14px;
            border-top-color: #7a5af8;
            animation: spin 0.7s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
